name: Actualizar números

on:
  schedule:
    - cron: "17 * * * *"   # cada hora
  workflow_dispatch:        # botón "Run workflow" para actualizar al momento
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build.mjs
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DASH_KEY: ${{ secrets.DASH_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
